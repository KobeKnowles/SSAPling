name: Release

# Publishes to PyPI when a version tag such as v0.1.0 is pushed.
# PyPI trusts this workflow directly (trusted publishing), so no token is stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test, build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ssapling/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      # A fresh environment with only the wheel installed: no extras, no dev tools.
      - run: uv venv --python 3.12 "$RUNNER_TEMP/clean"
      - run: uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
      - run: '"$RUNNER_TEMP/clean/bin/python" tests/packaging/check_install.py'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ssapling/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
